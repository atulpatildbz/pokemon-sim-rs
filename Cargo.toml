[package]
name = "pokegame"
version = "1.0.1"
edition = "2021"
description = "Faithful Rust port of BirdieSoft's POKéMON Simulator V4.5 (Delphi 7, 2004)"

[features]
default = ["bundled"]
# Compile the original PokeGame.exe / POKéGAME.dat into the binary when they are available
# (personal builds only: they are copyrighted). Files come from $POKEGAME_DIR or
# ../downloads/pokegame/extracted. `--no-default-features` builds a folder-reading binary.
bundled = []

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
ttf-parser = "0.25"
rodio = "0.20"

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
winit = { version = "0.30", features = ["android-native-activity"] }

[lib]
# cdylib: the Android NativeActivity loads libpokegame.so.
crate-type = ["rlib", "cdylib"]

[profile.release]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

# Two one-line patches for Android (see `pokegame:` comments in vendor/):
# - egui_glow: highp shaders — the stock mediump texture coordinates sample neighbouring
#   glyphs from the font atlas on phone GPUs (stray marks after letters).
# - egui-winit: Android's Back button (BrowserBack) maps to Escape.
[patch.crates-io]
egui_glow = { path = "vendor/egui_glow" }
egui-winit = { path = "vendor/egui-winit" }
